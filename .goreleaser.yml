project_name: pathvector-ng

before:
  hooks:
    - go generate
    - go mod download

builds:
  - id: pathvector
    # The binary stays `pathvector` so Pathvector NG is a drop-in replacement:
    # existing configs, systemd units and /etc paths keep working.
    binary: pathvector
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    goos:
      - linux
      - freebsd
    goarch:
      - amd64
      - arm64
      - mips64

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

nfpms:
  - id: pathvector
    package_name: pathvector-ng
    file_name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    vendor: Xodo Technology
    homepage: https://github.com/XodoTechnology/pathvector-ng
    maintainer: Xodo Technology <accounts@xodo.net>
    description: Pathvector NG is a declarative edge routing platform that automates route optimization and control plane configuration with secure and repeatable routing policy. Community-maintained continuation of natesales/pathvector.
    license: MIT
    section: utils
    priority: extra
    contents:
      - src: distrib/systemd/pathvector.service
        dst: /usr/lib/systemd/system/pathvector.service
      - src: distrib/systemd/pathvector-generate.service
        dst: /usr/lib/systemd/system/pathvector-generate.service
      - src: distrib/systemd/pathvector-generate.timer
        dst: /usr/lib/systemd/system/pathvector-generate.timer
      - src: distrib/systemd/pathvector-metrics.service
        dst: /usr/lib/systemd/system/pathvector-metrics.service
    provides:
      - pathvector
    replaces:
      - pathvector
    conflicts:
      - pathvector
    builds:
      - pathvector

    formats:
      - deb
      - rpm

publishers:
  # The vendorbuild publisher isn't really a publisher at all. It's a hack to run the vendorbuild/build.sh script
  # after binaries and packages are built but before the release step so packages for vendor platforms can be
  # added to the release.
  - name: vendorbuild
    cmd: ./vendorbuild/build.sh

release:
  extra_files:
    - glob: dist/pathvector-*arista*
    - glob: dist/pathvector-*juniper*
    - glob: dist/pathvector-*cisco*
    - glob: dist/pathvector-*mikrotik*
    - glob: pathvector-ng-*-release.pdf
