name: auto-release

# Every push to main that passes the end-to-end suite gets tagged with the
# next semver version (patch by default; put "#minor" or "#major" in the
# commit message to bump more). The tag then triggers release.yml, which
# runs the BIRD matrix and publishes the release.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  e2e:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Run end-to-end smoke test
        run: bash tests/e2e/run-tests.sh

  tag:
    needs: e2e
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute next version
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/${{ github.repository }}/git/refs/tags" --jq '.[].ref' \
            | sed 's|refs/tags/||' | grep -E '^v[0-9]+\.[0-9]+(\.[0-9]+)?$' \
            | sort -t. -k1,1n -k2,2n -k3,3n | tail -1 || true)
          major=${latest%%.*}; rest=${latest#*.}; minor=${rest%%.*}; patch=${rest#*.}
          msg=$(git log -1 --pretty=%B)
          if [[ "$msg" == *"#major"* ]]; then major=$((major+1)); minor=0; patch=0
          elif [[ "$msg" == *"#minor"* ]]; then minor=$((minor+1)); patch=0
          else patch=$((patch+1)); fi
          echo "tag=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "next tag: v${major}.${minor}.${patch} (from v${latest})"
      - name: Create tag
        # Create the ref via the REST API — GitHub makes it server-side, so a
        # GITHUB_TOKEN with only contents:write is enough even when the tagged
        # commit modifies .github/workflows/ (a git push would be refused).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.ver.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists — skipping"
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
          echo "created $tag"
