name: Snapshot

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  Snapshot:
    # Maintainers can comment /snapshot on a PR to cut a prerelease build
    if: >-
      ${{
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '/snapshot') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.issue.pull_request.head.sha }}
          repository: ${{ github.event.issue.pull_request.head.repo.full_name }}

      - name: Get snapshot ID
        id: snapshot_id
        run: |
          echo SNAPSHOT_ID=pathvector-ng_$(git describe --tags "$(git rev-list --tags --max-count=1)" | cut -c2-)-SNAPSHOT-$(git rev-parse --short HEAD) >> $GITHUB_OUTPUT

      - name: Add start comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            Starting snapshot release [`${{ steps.snapshot_id.outputs.SNAPSHOT_ID }}`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install PDF generation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: mv pathvector-ng*.pdf ${{ steps.snapshot_id.outputs.SNAPSHOT_ID }}.pdf || true
      - run: mkdir -p snapshot && mv dist/* snapshot/ && mv ${{ steps.snapshot_id.outputs.SNAPSHOT_ID }}.pdf snapshot/ || true

      - name: Upload snapshot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.snapshot_id.outputs.SNAPSHOT_ID }}
          path: snapshot/

      - name: Add finish comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            Snapshot [`${{ steps.snapshot_id.outputs.SNAPSHOT_ID }}`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) finished — download the build from the workflow artifacts.
