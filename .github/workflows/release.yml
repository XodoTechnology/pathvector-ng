name: goreleaser

# Stable releases: tag a commit on main as v<major>.<minor>.<patch>.
# The BIRD version matrix must pass before anything is published.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # semver vmajor.minor.patch format only

permissions:
  contents: write

jobs:
  # Validate the generated BIRD config against all supported BIRD versions
  # (.github/workflows/bird-matrix.yml) before anything is published
  bird-matrix:
    uses: ./.github/workflows/bird-matrix.yml

  goreleaser:
    needs: bird-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'

      - name: Install PDF generation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex

      - name: Store signing files
        run: |
          echo "$JUNIPER_KEY" | base64 -d > vendorbuild/juniper/key.pem
          echo "$JUNIPER_CERT" | base64 -d > vendorbuild/juniper/cert.pem
        shell: bash
        env:
          JUNIPER_KEY: ${{ secrets.JUNIPER_KEY }}
          JUNIPER_CERT: ${{ secrets.JUNIPER_CERT }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
